mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: false
mode: rule
log-level: error
ipv6: false
enable-process: true
find-process-mode: strict
tcp-concurrent: false
disable-keep-alive: true
unified-delay: true
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: true
  listen: :1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - +.localhost
    - +.localdomain
    - +.ip6-localhost
    - +.ip6-loopback
    - "*.example"
    - "*.invalid"
    - "*.test"
    - "*.home.arpa"
    - time.nist.gov
    - time.windows.com
    - time.android.com
    - pool.ntp.org
    - time.*.com
    - ntp.*.com
  default-nameserver:
    - https://8.8.8.8/dns-query
  direct-nameserver:
    - system
  proxy-server-nameserver:
    - quic://dns.adguard-dns.com
    - system
  nameserver:
    - https://dns.quad9.net/dns-query
    - https://security.cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  direct-nameserver-follow-policy: false
  prefer-h3: false
  respect-rules: false
  use-hosts: true
  use-system-hosts: true
  fallback: []
  fallback-filter:
    geoip: false
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
      - 10.10.34.0/24
    domain: []
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  device: Mihomo
proxy-providers:
  q:
    type: http
    url: https://raw.githubusercontent.com/liketolivefree/kobabi/main/prov_clash.yaml
    interval: 14400
    path: ./proxy-providers/q.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://www.gstatic.com/generate_204
      timeout: 10000
    override:
      udp: true
  b:
    type: http
    url: https://raw.githubusercontent.com/xtoolkit/TVC/main/subscriptions/meta/vless
    interval: 14400
    path: ./proxy-providers/b.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://www.gstatic.com/generate_204
      timeout: 10000
    exclude-type: ss|http|trojan|vmess|https|anytls|tuic|socks4|socks5
    override:
      udp: true
  i:
    type: http
    url: https://raw.githubusercontent.com/awesome-vpn/awesome-vpn/master/clash.yaml
    interval: 14400
    path: ./proxy-providers/i.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://www.gstatic.com/generate_204
      timeout: 10000
    exclude-type: ss|http|trojan|vmess|https|anytls|tuic|socks4|socks5
    override:
      udp: true
  j:
    type: http
    url: https://raw.githubusercontent.com/iampedii/whitedns-sub/main/mihomo.yaml
    interval: 14400
    path: ./proxy-providers/j.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://www.gstatic.com/generate_204
      timeout: 10000
    exclude-type: ss|http|trojan|vmess|https|anytls|tuic|socks4|socks5
    override:
      udp: true
  k:
    type: http
    url: https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/snippets/nodes.meta.yml
    interval: 14400
    path: ./proxy-providers/k.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://www.gstatic.com/generate_204
      timeout: 10000
    exclude-type: ss|http|trojan|vmess|https|anytls|tuic|socks4|socks5
    override:
      udp: true
  l:
    type: http
    url: https://raw.githubusercontent.com/snakem982/proxypool/main/source/clash-meta-2.yaml
    interval: 14400
    path: ./proxy-providers/l.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://www.gstatic.com/generate_204
      timeout: 10000
    exclude-type: ss|http|trojan|vmess|https|anytls|tuic|socks4|socks5
    override:
      udp: true
proxy-groups:
  - name: QQOLI
    type: select
    proxies:
      - MMOBI
    use:
      - q
      - j
  - name: MMOBI
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 0
    use:
      - q
      - b
      - i
      - j
      - k
      - l
rule-providers:
  aff_l:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/liketolivefree/kobabi/main/aff_l.mrs
    path: ./rule-providers/aff_l.mrs
    interval: 86400
  yun:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/liketolivefree/kobabi/main/yun.mrs
    path: ./rule-providers/yun.mrs
    interval: 86400
  oki:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/liketolivefree/kobabi/main/oki.mrs
    path: ./rule-providers/oki.mrs
    interval: 86400
  doki:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/liketolivefree/kobabi/main/doki.mrs
    path: ./rule-providers/doki.mrs
    interval: 86400
  xal:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/liketolivefree/kobabi/main/xal.mrs
    path: ./rule-providers/xal.mrs
    interval: 86400
  loo:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/liketolivefree/kobabi/main/loo.mrs
    path: ./rule-providers/loo.mrs
    interval: 86400
rules:
  - IP-CIDR,127.0.0.1/32,DIRECT,no-resolve
  - IP-CIDR,198.18.0.1/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,localdomain,DIRECT
  - DOMAIN-SUFFIX,localhost,DIRECT
  - DOMAIN-SUFFIX,ip6-localhost,DIRECT
  - DOMAIN-SUFFIX,ip6-loopback,DIRECT
  - RULE-SET,aff_l,REJECT
  - RULE-SET,yun,REJECT,no-resolve
  - DOMAIN-SUFFIX,ir,DIRECT
  - RULE-SET,xal,DIRECT
  - RULE-SET,oki,QQOLI
  - RULE-SET,loo,DIRECT,no-resolve
  - RULE-SET,doki,QQOLI,no-resolve
  - MATCH,QQOLI
