mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: false
mode: rule
log-level: info
ipv6: false
enable-process: true
find-process-mode: strict
tcp-concurrent: false
unified-delay: true
disable-keep-alive: true
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  listen: :1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - +.localhost
    - +.localdomain
    - +.ip6-localhost
    - +.ip6-loopback
    - "*.example"
    - "*.invalid"
    - "*.test"
    - "*.home.arpa"
    - time.nist.gov
    - time.windows.com
    - time.android.com
    - pool.ntp.org
    - time.*.com
    - ntp.*.com
  default-nameserver:
    - https://8.8.8.8/dns-query
  direct-nameserver:
    - system
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - system
  nameserver:
    - https://dns.quad9.net/dns-query
    - https://security.cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  direct-nameserver-follow-policy: false
  prefer-h3: false
  respect-rules: false
  use-hosts: true
  use-system-hosts: true
tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  device: Mihomo
sniffer:
  enable: false
proxy-providers:
  q:
    type: http
    url: https://raw.githubusercontent.com/liketolivefree/kobabi/main/prov_clash.yaml
    interval: 14400
    path: ./proxy-providers/q.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://www.gstatic.com/generate_204
      timeout: 10000
  b:
    type: http
    url: https://raw.githubusercontent.com/xtoolkit/TVC/main/subscriptions/meta/mix
    interval: 14400
    path: ./proxy-providers/b.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://www.gstatic.com/generate_204
      timeout: 10000
    exclude-type: ss|http|trojan|vmess|https|anytls|tuic|socks4|socks5
  c:
    type: http
    url: https://raw.githubusercontent.com/free18/v2ray/main/c.yaml
    interval: 14400
