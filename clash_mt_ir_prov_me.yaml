    health-check:
      enable: true
      interval: 1800
      url: https://www.gstatic.com/generate_204
      timeout: 10000
    exclude-type: ss|http|trojan|vmess|https|anytls|tuic|socks4|socks5
  j:
    type: http
    url: https://raw.githubusercontent.com/iampedii/whitedns-sub/main/mihomo.yaml
    interval: 14400
    path: ./proxy-providers/j.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://www.gstatic.com/generate_204
      timeout: 10000
    exclude-type: ss|http|trojan|vmess|https|anytls|tuic|socks4|socks5
  k:
    type: http
    url: https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/snippets/nodes.meta.yml
    interval: 14400
    path: ./proxy-providers/k.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://www.gstatic.com/generate_204
      timeout: 10000
    exclude-type: ss|http|trojan|vmess|https|anytls|tuic|socks4|socks5
  l:
    type: http
    url: https://raw.githubusercontent.com/snakem982/proxypool/main/source/clash-meta-2.yaml
    interval: 14400
    path: ./proxy-providers/l.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://www.gstatic.com/generate_204
      timeout: 10000
    exclude-type: ss|http|trojan|vmess|https|anytls|tuic|socks4|socks5
proxy-groups:
  - name: QQOLI
    type: select
    proxies:
      - MMOBI
    use:
      - q
      - b
      - c
      - i
      - j
      - k
      - l
  - name: MMOBI
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 0
    use:
      - q
      - b
      - c
      - i
      - j
      - k
      - l
